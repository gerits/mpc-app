[package]
name = "ministation"
version = "0.1.0"
description = "Lightweight sound module and performance workstation for the Akai MPK mini 3"
authors = ["Ruben Gerits"]
edition = "2021"

[lib]
name = "ministation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
midir = "0.11"
crossbeam-channel = "0.5"
cpal = "0.18.2"
rustysynth = "1.3.7"
hound = "3.5.1"
